apiVersion: batch/v1
kind: Job
metadata:
  name: bm3d-denoise
  labels: { praxis-stage: bm3d-denoise }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 7200          # BM3D is CPU-heavy; give it room
  template:
    metadata:
      labels: { praxis-stage: bm3d-denoise }
    spec:
      restartPolicy: Never
      # Runs on Nemesis, reading /data over NFS (degraded inputs live on Astraea)
      nodeSelector:
        kubernetes.io/hostname: nemesis
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bm3d
          image: praxis-cpu:0.2
          imagePullPolicy: Never        # imported into Nemesis containerd; no registry
          command: ["python", "/data/praxis/scripts/bm3d_denoise.py"]
          args:
            - "--degraded-manifest=/data/praxis/synthetic-degradations/sentinel2/degradation_manifest.csv"
            - "--out=/data/praxis/denoised/bm3d"
          resources:
            requests: { cpu: "4", memory: 4Gi }
            limits:   { cpu: "8", memory: 8Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        # /data on Nemesis is the NFS mount of Astraea:/data
        - name: data
          hostPath: { path: /data, type: Directory }
