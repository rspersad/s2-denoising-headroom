apiVersion: batch/v1
kind: Job
metadata:
  name: degrade-s2ships
  labels: { praxis-stage: synthetic-degradation }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400      # auto-clean 24h after finish
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels: { praxis-stage: synthetic-degradation }
    spec:
      restartPolicy: Never
      # Data lives on Astraea's /data, so pin there (Appendix D.7 data-locality pattern)
      nodeSelector:
        kubernetes.io/hostname: astraea
      # Run as raj (uid/gid 1000) so all outputs under /data stay raj-owned
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: degrade
          image: praxis-cpu:0.1
          imagePullPolicy: Never        # image is local in containerd; never pull from a registry
          command: ["python", "/repo/scripts/apply_degradation.py"]
          args:
            - "--manifest=/data/praxis/processed/s2ships_manifest.csv"
            - "--calib=/data/praxis/processed/noise_calibration.json"
            - "--out=/data/praxis/synthetic-degradations/sentinel2"
            - "--realizations=3"
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits:   { cpu: "4", memory: 4Gi }
          volumeMounts:
            - { name: repo, mountPath: /repo, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: repo
          hostPath: { path: ~/praxis, type: Directory }
        - name: data
          hostPath: { path: /data, type: Directory }
