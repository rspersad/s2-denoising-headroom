# Ultralytics AGPL-3.0 — YOLOv9e with an added P2/4 small-object head.
# Outputs P2/4, P3/8, P4/16, P5/32 (stock yolov9e is P3-P5).
# Derived from ultralytics/cfg/models/v9/yolov9e.yaml (8.4.51) by the same edit that
# produced yolov9m-p2.yaml and yolov9c-p2.yaml: FPN extended to P2 (nodes 36-38,
# concatenating the main-branch P2/4 feature at node 19), ADown back to P3 (node 39),
# Detect over [P2, P3, P4, P5]. Block depth n=2 kept throughout, matching stock yolov9e.
# Backbone (nodes 0-29, both GELAN branches with CBLinear/CBFuse) is unchanged from stock.

nc: 80 # number of classes (overridden by data.yaml at train time)

# GELAN backbone (unchanged from stock yolov9e)
backbone:
  - [-1, 1, nn.Identity, []]
  - [-1, 1, Conv, [64, 3, 2]] # 1-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 2-P2/4
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 2]] # 3
  - [-1, 1, ADown, [256]] # 4-P3/8
  - [-1, 1, RepNCSPELAN4, [512, 256, 128, 2]] # 5
  - [-1, 1, ADown, [512]] # 6-P4/16
  - [-1, 1, RepNCSPELAN4, [1024, 512, 256, 2]] # 7
  - [-1, 1, ADown, [1024]] # 8-P5/32
  - [-1, 1, RepNCSPELAN4, [1024, 512, 256, 2]] # 9

  - [1, 1, CBLinear, [[64]]] # 10
  - [3, 1, CBLinear, [[64, 128]]] # 11
  - [5, 1, CBLinear, [[64, 128, 256]]] # 12
  - [7, 1, CBLinear, [[64, 128, 256, 512]]] # 13
  - [9, 1, CBLinear, [[64, 128, 256, 512, 1024]]] # 14

  - [0, 1, Conv, [64, 3, 2]] # 15-P1/2
  - [[10, 11, 12, 13, 14, -1], 1, CBFuse, [[0, 0, 0, 0, 0]]] # 16
  - [-1, 1, Conv, [128, 3, 2]] # 17-P2/4
  - [[11, 12, 13, 14, -1], 1, CBFuse, [[1, 1, 1, 1]]] # 18
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 2]] # 19  (P2/4 feature)
  - [-1, 1, ADown, [256]] # 20-P3/8
  - [[12, 13, 14, -1], 1, CBFuse, [[2, 2, 2]]] # 21
  - [-1, 1, RepNCSPELAN4, [512, 256, 128, 2]] # 22  (P3/8 feature)
  - [-1, 1, ADown, [512]] # 23-P4/16
  - [[13, 14, -1], 1, CBFuse, [[3, 3]]] # 24
  - [-1, 1, RepNCSPELAN4, [1024, 512, 256, 2]] # 25  (P4/16 feature)
  - [-1, 1, ADown, [1024]] # 26-P5/32
  - [[14, -1], 1, CBFuse, [[4]]] # 27
  - [-1, 1, RepNCSPELAN4, [1024, 512, 256, 2]] # 28
  - [-1, 1, SPPELAN, [512, 256]] # 29  (P5/32 feature)

# FPN top-down to P2, then PAN bottom-up to P5
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 30
  - [[-1, 25], 1, Concat, [1]] # 31 cat backbone P4
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 2]] # 32  (P4 td)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 33
  - [[-1, 22], 1, Concat, [1]] # 34 cat backbone P3
  - [-1, 1, RepNCSPELAN4, [256, 256, 128, 2]] # 35  (P3 td)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 36  NEW
  - [[-1, 19], 1, Concat, [1]] # 37 cat backbone P2  NEW
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 2]] # 38  (P2/4-small)  -> Detect

  - [-1, 1, ADown, [256]] # 39  NEW (P2 -> P3)
  - [[-1, 35], 1, Concat, [1]] # 40 cat head P3 td
  - [-1, 1, RepNCSPELAN4, [256, 256, 128, 2]] # 41  (P3/8)  -> Detect

  - [-1, 1, ADown, [256]] # 42  (P3 -> P4)
  - [[-1, 32], 1, Concat, [1]] # 43 cat head P4 td
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 2]] # 44  (P4/16)  -> Detect

  - [-1, 1, ADown, [512]] # 45  (P4 -> P5)
  - [[-1, 29], 1, Concat, [1]] # 46 cat backbone P5
  - [-1, 1, RepNCSPELAN4, [512, 1024, 512, 2]] # 47  (P5/32)  -> Detect

  - [[38, 41, 44, 47], 1, Detect, [nc]] # 48 Detect(P2, P3, P4, P5)
